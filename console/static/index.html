<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aifactory console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%274%27 fill=%27%230b5d5d%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <!-- ナビは頻度順（console/UX.md）。文言は strings.js の T から data-t で入る -->
  <nav class="rail" aria-label="main">
    <a class="brand" href="#/board"><span class="brand-mark" aria-hidden="true"></span>aifactory<small>console</small></a>
    <a href="#/board" data-nav="board"><span data-t="nav.board"></span><b id="n-board"></b></a>
    <a href="#/intake" data-nav="intake"><span data-t="nav.intake"></span></a>
    <a href="#/runs" data-nav="runs"><span data-t="nav.runs"></span><b id="n-runs"></b></a>
    <a href="#/jobs" data-nav="jobs"><span data-t="nav.jobs"></span><b id="n-jobs"></b></a>
    <a href="#/sandbox" data-nav="sandbox"><span data-t="nav.sandbox"></span><b id="n-sandbox"></b></a>
    <a href="#/logs" data-nav="logs"><span data-t="nav.logs"></span></a>
    <a href="#/config" data-nav="config"><span data-t="nav.config"></span></a>
    <div class="rail-foot">
      <span id="clock">—</span>
      <span id="tznote" class="tznote" hidden></span>
      <span id="conn" class="conn"></span>
      <button type="button" class="linkish" data-act="help" data-t="nav.shortcuts"></button>
    </div>
  </nav>
  <div class="col-main">
    <div id="offline" class="banner err" role="alert" data-t="banner.offline" hidden></div>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="dlg"></dialog>
<dialog id="help"></dialog>
<script src="/strings.js"></script>
<script src="/app.js"></script>
</body>
</html>

# kumitate の PJ 定義（workflow/kit/schema/project.schema.json）。手順は常備側、ここは事実と方針だけ
name: kumitate
display_name: kumitate
repo: akkijp/kumitate
base_branch: develop
hotfix_base: main
app_dir: /home/dev/app/apps/kumitate
url: http://localhost:3000
gates: gates.sh
prepare: prepare.sh
capabilities:                   # この PJ の VM にある能力（チケット 552）。書いていないキーは「未宣言＝照合しない」
  browser: false                # 実ブラウザでの目視ができず #526 の完了条件が未達のまま着地した
  docker: false                 # #528 / #529 の `make e2e` フル実走（docker スタック）は sandbox では実行不能
  gui: false                    # デスクトップ画面は無い（#529 の「画面を読む」検証は実行者が管理役かオーナー）
  # egress: このリポジトリからは未実測（pnpm install は通るが、外部バイナリの取得は失敗した実績がある）。
  #         管理役が VM で確かめてから書くこと。未宣言のあいだは egress の照合をしない
stack: "pnpm 10 monorepo（turbo）/ Node 22 / Next.js（apps/web :3000）/ PostgreSQL 16 + pgvector / drizzle / vitest"
facts:
  - "リポジトリ直下は台帳と docs。アプリは apps/kumitate/（pnpm workspace: apps/{web,marketing,scheduler}、packages/{db,dsl,generate,app-sdk,feedback-widget}）"
  - "依存は `pnpm install --frozen-lockfile`（apps/kumitate で）。pnpm は packageManager の版に固定"
  - "DB は VM ローカルの PostgreSQL 16（role kumitate / DB kumitate、DATABASE_URL は apps/kumitate/.env）。migrate は `pnpm --filter @kumitate/db db:migrate`"
  - "CI のゲート: `pnpm tokens:check` / typecheck（dsl, db, generate, web, marketing）/ `pnpm --filter @kumitate/web lint` / `pnpm --filter @kumitate/marketing lint` / test（同 5 パッケージ）/ `pnpm --filter @kumitate/web test:dom`"
  - "個別テストは `pnpm --filter @kumitate/web exec vitest run <file>`"
  - "テストが生成する apps/kumitate/packages/db/.data/ 配下（turso のローカル DB）は追跡外。git add しない"
  - "掃き寄せ（`sandbox: uncommitted changes by agent`）は package.json / pnpm-lock.yaml を既定で拾わず HEAD へ戻す（#572）。意図した依存の変更は自分で `git add` してコミットする"
  - "既知の問題（2026-09-06）: apps/web の calendar 表題テスト 2 件がフィクスチャ 2026-08 固定で時間依存"
  - "`tokens/` はデザイントークンの単一情報源。変えたら `pnpm tokens:build` して差分をコミット"
  - "大きな作業は管理役 / devteam の体制で行う運用（ルート CLAUDE.md）。sandbox の agent は 1 タスク 1 PR の小さな仕事を担う"
review_points:
  - "apps/web のテストを skip / 削除して緑にしていないか"
  - "tokens/ の変更に tokens:build の差分が伴っているか"
  - "packages/db の schema 変更に migration が伴っているか（drizzle）"
forbidden:
  - "packages/db の migration を手で編集しない（drizzle-kit generate を使う）"
  - "deploy.yml / .github/workflows を変えない"
  - ".env の実値をコミットしない"

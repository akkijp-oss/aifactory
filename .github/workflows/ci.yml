# CI: テスト（console / workflow、VM も claude も使わない）と bash の構文検査、ドキュメントサイトの strict ビルド
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: bash -n
        run: |
          for f in sandbox/bin/sandbox sandbox/bin/install.sh sandbox/bin/gh-app-setup sandbox/proxmox/*.sh workflow/kit/steps/*.sh examples/projects/*/*.sh bin/*.sh bin/ctl-update console/bin/install.sh console/bin/mcp-remote workers/install.sh workers/templates/*.sh workers/computer/*.sh; do
            bash -n "$f" || exit 1
            echo "ok $f"
          done
      - name: python -m py_compile
        run: python3 -m py_compile lib/aifactory_paths.py lib/aifactory_attachments.py workflow/bin/run kanban/bin/kb glue/bin/intake glue/bin/dispatch console/bin/console console/bin/mcp console/lib/core.py
      - name: unittest (workflow)
        run: python3 -m unittest discover -s workflow/tests -v
      - name: unittest (console + mcp)
        run: python3 -m unittest discover -s console/tests -v
      - name: unittest (pull control)
        run: python3 -m unittest discover -s workers/tests -v
      - name: paths (fresh clone = workspace mode)
        run: python3 lib/aifactory_paths.py | tee /dev/stderr | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["legacy"] is False, d'

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/go.mod
          cache: false
      - run: go test -race ./...
        working-directory: workers
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/aifactory-worker ./cmd/aifactory-worker
        working-directory: workers

  linux-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/go.mod
          cache: false
      # ランナー付属の Google Chrome の apt リポジトリは使わない。index のハッシュ不一致で apt-get update ごと落ちることがある（2026-09-09 PR #69）
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
      - run: sudo apt-get update && sudo apt-get install -y python3-pil python3-tk xvfb xauth xdotool xclip
      - run: go test -c -o /tmp/aifactory-worker.test ./cmd/aifactory-worker
        working-directory: workers
      - run: sudo env -u INVOCATION_ID AIFACTORY_LINUX_SYSTEMD_TEST=1 /tmp/aifactory-worker.test -test.run TestLinux -test.v
      - run: AIFACTORY_X11_TEST=1 xvfb-run -a /usr/bin/python3 -m unittest discover -s workers/tests -p test_linux_desktop.py -v
      - run: go build -trimpath -o /tmp/aifactory-computer ./cmd/aifactory-computer
        working-directory: workers

  windows-worker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/go.mod
          cache: false
      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          Get-ChildItem workers -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors){throw ($errors | Out-String)}
          }
      - run: go test ./...
        working-directory: workers
      - run: |
          go build -trimpath -o aifactory-worker.exe ./cmd/aifactory-worker
          go build -trimpath -o aifactory-computer.exe ./cmd/aifactory-computer
          go build -trimpath -ldflags=-H=windowsgui -o aifactory-desktop.exe ./cmd/aifactory-computer
        working-directory: workers

  mac-computer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/go.mod
          cache: false
      - run: go test ./cmd/aifactory-computer
        working-directory: workers
      - run: go build -trimpath -o /tmp/aifactory-computer ./cmd/aifactory-computer
        working-directory: workers
      - run: swiftc -parse-as-library -O workers/computer/macos.swift -o /tmp/desktop-native

  secrets:
    # 秘密情報の漏えい検査（全履歴）。gitleaks の CLI を直接使う（gitleaks-action は org で license が要る）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          ver=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="--all" .
      - name: oss-check (secrets + paths)
        run: bin/oss-check.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      - run: mkdocs build -f website/mkdocs.yml --strict

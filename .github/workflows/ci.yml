# CI: テスト（console / workflow、VM も claude も使わない）と bash の構文検査、ドキュメントサイトの strict ビルド
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: bash -n
        run: |
          for f in sandbox/bin/sandbox sandbox/bin/install.sh sandbox/bin/gh-app-setup sandbox/proxmox/*.sh workflow/kit/steps/*.sh examples/projects/*/*.sh bin/*.sh; do
            bash -n "$f" && echo "ok $f"
          done
      - name: python -m py_compile
        run: python3 -m py_compile lib/aifactory_paths.py workflow/bin/run kanban/bin/kb glue/bin/intake glue/bin/dispatch console/bin/console console/bin/mcp console/lib/core.py
      - name: unittest (workflow)
        run: python3 -m unittest discover -s workflow/tests -v
      - name: unittest (console + mcp)
        run: python3 -m unittest discover -s console/tests -v
      - name: paths (fresh clone = workspace mode)
        run: python3 lib/aifactory_paths.py | tee /dev/stderr | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["legacy"] is False, d'

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      - run: mkdocs build -f website/mkdocs.yml --strict

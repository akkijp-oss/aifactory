# feature-long: 大きめの機能追加(変更ファイル 10 本超・共通枠の組み替え等)。feature と同じ流れで、
#   implementer の時間上限だけ 60 分 → 180 分に延ばす。
#   ★2026-09-09 kumitate #294 で、60 分の `timeout` が未コミットの実装ごと agent を切り、75 分の成果が全損した実事故から新設。
#   implement の brief で「30 分ごとに WIP コミット」も求め、切られても wip ブランチに残るようにする。
name: feature-long
description: 大きめの機能追加。feature と同じ流れで implementer の上限が 180 分。plan.md がチケットに添付済みなら planner はそれを起点に差分だけ直す
inputs: [ticket.md]
steps:
  - id: research
    role: researcher
    brief: |
      チケットの機能に関係する既存コード・既存の決定（docs / ADR / CLAUDE.md）・外部仕様を集める。
      「既にある似た仕組み」と「守るべき既存の約束」を planner に申し送る。
      チケット本文に前回 run の research.md / plan.md が添付されているなら、それを起点に**差分(base が進んだ分)だけ**確かめる。
    outputs: [research.md]
    timeout_min: 40
    next: design

  - id: design
    role: planner
    model: claude-fable-5-1   # 計画は Fable で丁寧に（メンテナの判断 2026-09-12）。judgment クラスの既定は Opus なのでこの工程だけ上書き
    brief: |
      research.md を踏まえて設計する。UI があるなら導線（誰が・どこから・何をして・どうなる）を先に書く。
      大きければ段階に分け、この PR で入れる段階だけを計画にする。
      チケット本文に前回 run の plan.md が添付されているなら、それを正として base の変化分だけ直す(作り直さない)。
    inputs: [research.md]
    outputs: [plan.md]
    timeout_min: 40
    next: implement

  - id: implement
    role: implementer
    brief: |
      ★時間上限は 180 分。**30 分ごとに必ず作業ブランチへコミットする**(WIP でよい・メッセージ先頭に `wip:`)。
      上限で切られてもコミット済みの分は wip ブランチに残り、次の attempt が続きから進められる。
      最後に `report.md` を書く前にもコミットする。
    inputs: [plan.md, research.md]
    outputs: [git, report.md]
    timeout_min: 180
    next: gates

  - id: gates
    code: gates.sh
    outputs: [gates.txt]
    on_pass: review
    on_fail: { goto: implement, max_loops: 2, else: human }

  - id: review
    role: reviewer
    brief: |
      設計（plan.md）との整合と、既存の約束（research.md の申し送り）を破っていないかを重点的に見る。
    inputs: [plan.md, research.md, report.md, gates.txt]
    outputs: [review.md]
    timeout_min: 60
    on_pass: sync
    on_fail: { goto: implement, max_loops: 1, else: human }

  - id: sync
    code: sync-base
    on_pass: pr
    on_fail: { goto: resolve, max_loops: 2, else: human }

  - id: resolve
    role: implementer
    brief: |
      **base の取り込みで戻された**（PR を作る直前に `git merge origin/<base>` が衝突した、または ADR の番号が重複した）。
      やることは戻された理由の解消だけで、この PR 本来の変更は直さない・広げない。役割文書の「base の取り込みで戻されたとき」の節に従う。
    outputs: [git, report.md]
    timeout_min: 60
    next: gates

  - id: pr
    code: pr-create.sh
    inputs: [plan.md, report.md, review.md, gates.txt]
    outputs: [pr_url]
    next: automerge

  - id: automerge
    code: pr-automerge.sh
    on_pass: end
    on_fail: human
